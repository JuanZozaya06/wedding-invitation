<aside class="backoffice-sidebar" (keydown.escape)="vm.closeAdminMenu()">
  <div class="admin-mobile-bar">
    <strong>{{ vm.monogram }} · Panel de gestión</strong>
    <button
      id="admin-menu-toggle"
      class="admin-menu-toggle"
      type="button"
      aria-controls="admin-navigation"
      [attr.aria-expanded]="vm.adminMenuOpen"
      [attr.aria-label]="vm.adminMenuOpen ? 'Cerrar menú' : 'Abrir menú'"
      (click)="vm.adminMenuOpen = !vm.adminMenuOpen"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        @if (vm.adminMenuOpen) {
          <path d="m6 6 12 12M18 6 6 18" />
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </div>
  @if (vm.adminMenuOpen) {
    <button
      class="admin-menu-backdrop"
      type="button"
      tabindex="-1"
      aria-label="Cerrar menú"
      (click)="vm.closeAdminMenu()"
    ></button>
  }
  <div class="backoffice-brand">
    <span class="backoffice-monogram">{{ vm.monogram }}</span>
    <div><strong>Nuestra boda</strong><span>Panel de gestión</span></div>
  </div>
  <p class="backoffice-nav-label">Organización</p>
  <nav
    id="admin-navigation"
    class="admin-tabs backoffice-nav"
    [class.is-open]="vm.adminMenuOpen"
    aria-label="Secciones del admin"
  >
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'overview'"
      [attr.aria-current]="vm.activeAdminTab === 'overview' ? 'page' : null"
      (click)="vm.setAdminTab('overview')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z" /></svg
      ><span>Resumen</span>
    </button>
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'invitations'"
      [attr.aria-current]="vm.activeAdminTab === 'invitations' ? 'page' : null"
      (click)="vm.setAdminTab('invitations')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 6 9 7 9-7" /></svg
      ><span>Invitaciones</span>
    </button>
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'confirmed'"
      [attr.aria-current]="vm.activeAdminTab === 'confirmed' ? 'page' : null"
      (click)="vm.setAdminTab('confirmed')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="9" cy="7" r="3" />
        <path d="M3 21v-3a6 6 0 0 1 12 0v3m1-11 2 2 4-4" /></svg
      ><span>Confirmados</span>
    </button>
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'messages'"
      [attr.aria-current]="vm.activeAdminTab === 'messages' ? 'page' : null"
      (click)="vm.setAdminTab('messages')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M21 11a8 8 0 0 1-8 8H7l-4 3V5a2 2 0 0 1 2-2h8a8 8 0 0 1 8 8Z"
        />
        <path d="M7 8h9M7 12h6" /></svg
      ><span>Mensajes</span>
    </button>
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'media'"
      [attr.aria-current]="vm.activeAdminTab === 'media' ? 'page' : null"
      (click)="vm.setAdminTab('media')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <circle cx="8" cy="9" r="1.5" />
        <path d="m3 16 5-4 4 3 4-5 5 6" /></svg
      ><span>Fotos</span>
    </button>
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'songs'"
      [attr.aria-current]="vm.activeAdminTab === 'songs' ? 'page' : null"
      (click)="vm.setAdminTab('songs')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 18V5l11-2v13M9 9l11-2" />
        <ellipse cx="6" cy="18" rx="3" ry="3" />
        <ellipse cx="17" cy="16" rx="3" ry="3" /></svg
      ><span>Recomendaciones</span>
    </button>
    <button
      type="button"
      [class.is-active]="vm.activeAdminTab === 'notes'"
      [attr.aria-current]="vm.activeAdminTab === 'notes' ? 'page' : null"
      (click)="vm.setAdminTab('notes')"
    >
      <svg
        class="admin-nav-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="5" y="3" width="14" height="18" rx="2" />
        <path d="M9 7h6M9 11h6M9 15h4" /></svg
      ><span>Notas</span>
    </button>
    <div class="admin-mobile-tools">
      <p class="admin-mobile-section-label">Acciones</p>
      <app-admin-actions />
      <p class="admin-mobile-section-label">Resumen de cantidades</p>
      <app-admin-stats />
    </div>
  </nav>
  <div class="backoffice-sidebar-note">
    <span class="eyebrow">{{ vm.coupleNames }}</span>
    <p>Cada invitado, parte de nuestra historia.</p>
  </div>
</aside>
